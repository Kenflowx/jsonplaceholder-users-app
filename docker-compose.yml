services:
  db:
    image: postgres:17
    container_name: kenflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agencia
      POSTGRES_PASSWORD: agencia123
      POSTGRES_DB: kenflow_db
    ports:
      - "5432:5432"
    volumes:
      - kenflow_pgdata:/var/lib/postgresql/data

volumes:
  kenflow_pgdata:
